<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FullShot — Vista previa</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e8eaed;
    --muted: #9aa2b1;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: -0.01em; margin-right: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-right: auto; }
  .meta b { color: var(--text); font-weight: 600; }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: #232936;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { background: #2c3444; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 24px; display: flex; justify-content: center; }
  #shell {
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-width: 1000px;
    width: 100%;
  }
  #preview { display: block; width: 100%; height: auto; }
  #status {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
  }
  .note {
    max-width: 1000px;
    margin: 0 auto 16px;
    padding: 10px 14px;
    border-radius: 8px;
    background: #2a2313;
    border: 1px solid #5c4a18;
    color: #f5d98a;
    font-size: 13px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <span class="brand">FullShot</span>
    <span class="meta" id="meta">Armando la captura…</span>
    <button id="copy">Copiar</button>
    <button id="pdf">Descargar PDF</button>
    <button id="png" class="primary">Descargar PNG</button>
  </header>
  <div id="note" class="note hidden"></div>
  <main>
    <div id="shell">
      <div id="status">Uniendo los tramos…</div>
      <img id="preview" class="hidden" alt="Vista previa de la captura">
    </div>
  </main>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FullShot — Preview</title>
<style>
  :root {
    /* ToolTank Brand Guidelines v1.0 "A Digital Systems Studio" */
    --bg: #0D1B2A;            /* ToolTank Navy */
    --panel: #1C1F2A;         /* ToolTank Black */
    --surface: #F0EDE8;       /* Warm Off-White */
    --border: #2A3442;
    --text: #F0EDE8;
    --muted: #8B98A5;
    --accent: #C9AB4C;        /* Architectural Brass */
    --accent-hover: #D8BC65;
    --info: #5F9F9A;          /* Muted Aqua, notices only */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: -0.01em; margin-right: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-right: auto; }
  .meta b { color: var(--text); font-weight: 600; }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: #223041;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { background: #2A3442; }
  /* Brass is light: text on top goes navy, not white. */
  button.primary { background: var(--accent); border-color: var(--accent); color: #0D1B2A; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 24px; display: flex; justify-content: center; }
  #shell {
    background: var(--surface);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 60px -22px rgba(0,0,0,.55);
    max-width: 1000px;
    width: 100%;
  }
  #preview { display: block; width: 100%; height: auto; }
  #status {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
  }
  .note {
    max-width: 1000px;
    margin: 0 auto 16px;
    padding: 10px 14px;
    border-radius: 8px;
    background: #16292B;
    border: 1px solid #2F5A57;
    color: #9CCFC9;
    font-size: 13px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <span class="brand">FullShot</span>
    <span class="meta" id="meta">Building the capture…</span>
    <button id="copy">Copy</button>
    <button id="pdf">Download PDF</button>
    <button id="png" class="primary">Download PNG</button>
  </header>
  <div id="note" class="note hidden"></div>
  <main>
    <div id="shell">
      <div id="status">Stitching the slices…</div>
      <img id="preview" class="hidden" alt="Preview of the capture">
    </div>
  </main>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
